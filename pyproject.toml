[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stigmergy-robustness"
version = "0.1.0"
description = "Simulated cooperative resource retrieval: clean mechanics pilot"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pettingzoo==1.24.3", "gymnasium==1.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
